<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>岩心数字化平台</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/light.css">
</head>
<body>
<div id="app">
  <aside class="rail">
    <a class="rail-brand" href="#/home" aria-label="岩心数字化平台">
      <span class="brand-mark"><i></i></span>
      <span class="rail-brand-text">CORE<br>LAB</span>
    </a>
    <nav class="rail-nav" id="railNav">
      <a href="#/home" data-nav="home"><span class="ico">◫</span><em>总览</em></a>
      <a href="#/map" data-nav="map"><span class="ico">◎</span><em>井位</em></a>
      <a href="#/wells" data-nav="wells"><span class="ico">▤</span><em>井档案</em></a>
        <a href="#/entry" data-nav="entry"><span class="ico">＋</span><em>录入</em></a>
      <a href="#/search" data-nav="search"><span class="ico">⌕</span><em>影像</em></a>
      <a href="#/inventory" data-nav="inventory"><span class="ico">▣</span><em>库存</em></a>
      <a href="#/stats" data-nav="stats"><span class="ico">▥</span><em>分析</em></a>
      <a href="#/admin" data-nav="admin"><span class="ico">⚙</span><em>设置</em></a>
    </nav>
    <div class="rail-foot">
      <a href="#/help" data-nav="help"><span class="ico">?</span><em>帮助</em></a>
      <div class="rail-version">V1.0</div>
    </div>
  </aside>

  <div class="shell">
    <header class="commandbar">
      <div class="cb-left">
        <div class="cb-title" id="pageTitle">总览</div>
        <div class="cb-sub" id="pageSub">CORE OPERATIONS</div>
      </div>
      <form class="global-search" id="globalSearch">
        <span class="gs-ico">⌕</span>
        <input id="globalQ" placeholder="搜索井号、岩性、深度、影像类型…" autocomplete="off">
        <kbd>Enter</kbd>
      </form>
      <div class="cb-right">
        <span class="cb-updated">更新 <b id="updatedAt">—</b></span>
        <span class="status-pill"><i></i>数据在线</span>
        <span class="cb-time" id="clock"></span>
        <a class="top-link" id="loginLink" href="#/login">登录</a>
        <span class="user-chip" id="userChip">GU</span>
      </div>
    </header>
    <main id="view" class="view"></main>
  </div>
</div>
<div id="modalRoot"></div>
<div id="toast" class="toast"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
